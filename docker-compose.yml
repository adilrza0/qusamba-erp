version: '3.8'

services:
  qusamba-erp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qusamba-erp-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=${MONGO_URI:-mongodb+srv://user:pass@cluster0.mongodb.net/QusambaERP?retryWrites=true&w=majority}
      - JWT_SECRET=${JWT_SECRET:-please_set_a_long_random_jwt_secret_for_production}
      - AUTO_SEED=${AUTO_SEED:-clean}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:5000}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
