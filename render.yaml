services:
  - type: web
    name: qusamba-erp
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build && cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: AUTO_SEED
        value: clean
